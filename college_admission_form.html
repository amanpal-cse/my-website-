
<!DOCTYPE html>
<html>
<head>
    <title>College Admission Form</title>
    <style>
        body {
            font-family: Arial;
            background: #eaf2f8;
        }
        form {
            width: 350px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border: 2px solid #3498db;
            border-radius: 10px;
        }
        h2 {
            text-align: center;
            color: #2980b9;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }
        input[type="submit"] {
            background: #2980b9;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <form>
        <h2>Admission Form</h2>

        Name:
        <input type="text" name="name" required>

        Date of Birth:
        <input type="date" name="dob" required>

        Gender:
        <select name="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        Course:
        <select name="course" required>
            <option value="">Select Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>BBA</option>
            <option>MCA</option>
        </select>

        Address:
        <textarea name="address" rows="3"
                  required></textarea>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
