
<!DOCTYPE html>
<html>
<head>
    <title>College Facilities</title>
    <style>
        body {
            font-family: Arial;
            background: #eaf2f8;
            text-align: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .box {
            width: 220px;
            padding: 25px;
            background: white;
            border: 2px solid #2980b9;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .box h2 {
            color: #21618c;
        }
    </style>
</head>
<body>
    <h1>College Facilities</h1>

    <div class="container">
        <div class="box">
            <h2>Library</h2>
            <p>A library with books, journals and
            a quiet reading area.</p>
        </div>

        <div class="box">
            <h2>Laboratory</h2>
            <p>Modern laboratories for practical
            learning and experiments.</p>
        </div>

        <div class="box">
            <h2>Sports</h2>
            <p>Sports grounds and facilities for
            indoor and outdoor games.</p>
        </div>

        <div class="box">
            <h2>Hostel</h2>
            <p>Accommodation facilities for
            students from different cities.</p>
        </div>
    </div>
</body>
</html>
