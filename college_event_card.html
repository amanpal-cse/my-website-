
<!DOCTYPE html>
<html>
<head>
    <title>College Event Cards</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f7;
            text-align: center;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;
        }
        .card {
            width: 250px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            border: 2px solid #3498db;
            box-shadow: 0 3px 8px gray;
            box-sizing: border-box;
        }
        .card h2 {
            color: #21618c;
        }
        .card button {
            background: #2874a6;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>College Events</h1>

    <div class="container">
        <div class="card">
            <h2>Annual Fest</h2>
            <p>Date: 15 November 2026</p>
            <p>A cultural event featuring music,
            dance and drama.</p>
            <button type="button">Learn More</button>
        </div>

        <div class="card">
            <h2>Technical Seminar</h2>
            <p>Date: 20 November 2026</p>
            <p>A seminar about new technologies
            and innovation.</p>
            <button type="button">Learn More</button>
        </div>

        <div class="card">
            <h2>Sports Day</h2>
            <p>Date: 25 November 2026</p>
            <p>A sports event featuring indoor
            and outdoor competitions.</p>
            <button type="button">Learn More</button>
        </div>
    </div>
</body>
</html>
