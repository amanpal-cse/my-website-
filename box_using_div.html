<!DOCTYPE html>
<html>
<head>
    <title>College Notice</title>

    <style>
        .notice {
            width: 500px;
            margin: 50px auto;
            padding: 20px;
            background-color: lightyellow;
            border: 3px solid black;
        }

        h2 {
            color: red;
            text-align: center;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="notice">

        <h2>College Notice</h2>

        <p>
            All students are informed that the college will remain
            open according to the regular timetable.
        </p>

        <p>
            Students are requested to attend their classes regularly.
        </p>

    </div>

</body>
</html>
